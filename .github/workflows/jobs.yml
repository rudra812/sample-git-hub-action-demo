name: Job files
on: 
    workflow_run: 
        workflows: [first_work_flow] #name
        types: 
            - completed
# on: push
jobs:
    exist-html:
        if: ${{github.event.workflow_run.conclusion == 'success'}}
        runs-on: ubuntu-latest

        steps:
            - name: checkout repo
              uses: actions/checkout@v4
            
            - name: existance html
              run: test -f index.html
    
    exist-js:
        if: ${{github.event.workflow_run.conclusion == 'success'}}
        runs-on: ubuntu-latest

        steps:
            - name: checkout repo
              uses: actions/checkout@v4
            
            - name: existance js
              run: test -f index.js

    
    validate-code:
        needs: [exist-html, exist-js]
        runs-on: ubuntu-latest

        steps:
            - name: checkout repo
              uses: actions/checkout@v4

            - name: validate html code
              run: npx htmlhint index.html

            - name: validate js code
              run: node -c index.js

